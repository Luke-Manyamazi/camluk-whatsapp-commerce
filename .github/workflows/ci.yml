name: CI

on:
  push:
    branches:
      - main
      - feature/camluk-dashboard
  pull_request:
    branches:
      - main
      - feature/camluk-dashboard

permissions:
  contents: read

jobs:
  validate:
    name: Build, test and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace=@camluk/api

      - name: Lint web
        run: npm run lint --workspace=web

      - name: Build web
        run: npm run build --workspace=web

      - name: Run API tests
        run: npm run test --workspace=@camluk/api

      - name: Dependency security audit
        run: npm audit --audit-level=high
